<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contacto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background-color: #f9f9f9; }
    footer { background-color: #212529; color: #adb5bd; }
    .form-icon { color: #0d6efd; font-size: 1.5rem; margin-right: 0.5rem; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">HTML5</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="evolucion.html">Línea del tiempo</a></li>
          <li class="nav-item"><a class="nav-link" href="comparacion.html">Etiquetas</a></li>
          <li class="nav-item"><a class="nav-link" href="ventajas.html">Ventajas</a></li>
          <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="bg-warning text-dark py-4">
    <div class="container">
      <h1 class="display-5 fw-bold">Contacto</h1>
    </div>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="card-title mb-4">¿Tienes preguntas?</h2>
            <p class="text-muted mb-4">Envíanos tus comentarios o dudas sobre la evolución de HTML.</p>
            
            <form>
              <div class="mb-3">
                <label for="nombre" class="form-label"><i class="bi bi-person form-icon"></i>Nombre completo</label>
                <input type="text" class="form-control" id="nombre" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label"><i class="bi bi-envelope form-icon"></i>Correo electrónico</label>
                <input type="email" class="form-control" id="email" required>
              </div>
              <div class="mb-3">
                <label for="mensaje" class="form-label"><i class="bi bi-chat-left-text form-icon"></i>Mensaje</label>
                <textarea class="form-control" id="mensaje" rows="4" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2">Enviar mensaje</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 bg-dark text-light">
    <div class="container text-center">
      <p class="mb-0">&copy; 2025 – Proyecto Educativo UTPL</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
